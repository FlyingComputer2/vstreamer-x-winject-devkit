<title id="tt">ROV-GND-P4 50 by 50 mm top-view Rev A placement</title><desc id="dd">Precisely scaled 50mm square PCB top view. All eight JST-GH connectors are standing top-entry, USB-C lies sideways, camera north, radio SDIO south, 3 by 13 header east, four mounting holes at exact corners with center offset 3.5mm, microSD on bottom with north-facing edge opening. No copper routing represented.</desc>
