<text x="500" y="823" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#52697c">4 corner mounting holes · independent camera and radio flex ports · no SPI-EXT JST-GH</text>
<text x="500" y="856" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#52697c">Connector placement and orientation must be checked against exact footprints, latches and cables.</text>
