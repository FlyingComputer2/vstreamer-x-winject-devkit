<title id="t">ROV-GND-P4 Rev A — square 120 mm placement concept</title>
<desc id="d">Top view with camera FPC north, USB and six JST GH connectors west, GPIO 3x13 east, radio SDIO FPC and power south. Concept only, not to scale.</desc>
